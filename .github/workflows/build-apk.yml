name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare webDir (www)
        run: |
          rm -rf www
          mkdir -p www
          for f in index.html app.js style.css sw.js manifest.json \
                   icon-192.png icon-512.png icon-48.png \
                   favicon-32.png favicon-48.png apple-touch-icon.png; do
            if [ -f "$f" ]; then cp -f "$f" www/; fi
          done
          if [ -d avatars ]; then cp -a avatars www/; fi
          if [ -d banners ]; then cp -a banners www/; fi
          test -f www/index.html || (echo "FALTA index.html en www" && exit 1)
          echo "www listo:" && ls -la www

      - name: Add Android platform and sync
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject google-services.json (FCM)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "OK: google-services.json desde secret"
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "OK: google-services.json desde repo"
          else
            echo "AVISO: sin google-services.json"
          fi

      - name: Wire Google Services Gradle plugin
        run: |
          if [ -f android/build.gradle ] && ! grep -q 'com.google.gms:google-services' android/build.gradle; then
            python3 -c "
          from pathlib import Path
          p=Path('android/build.gradle')
          lines=p.read_text().splitlines()
          out=[]
          done=False
          for line in lines:
              out.append(line)
              if (not done) and 'classpath' in line and 'com.android.tools.build:gradle' in line:
                  out.append(\"        classpath 'com.google.gms:google-services:4.5.0'\")
                  done=True
          p.write_text(chr(10).join(out)+chr(10))
          print('classpath', 'ok' if done else 'skip')
          "
          fi
          if [ -f android/app/build.gradle ]; then
            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle; then
              echo "" >> android/app/build.gradle
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
            if ! grep -q 'firebase-bom' android/app/build.gradle; then
              python3 -c "
          from pathlib import Path
          p=Path('android/app/build.gradle')
          t=p.read_text()
          if 'firebase-bom' not in t and 'dependencies {' in t:
              t=t.replace('dependencies {', \"dependencies {\\n    implementation platform('com.google.firebase:firebase-bom:34.17.0')\\n    implementation 'com.google.firebase:firebase-messaging'\", 1)
              p.write_text(t)
              print('firebase deps ok')
          "
            fi
          fi

      - name: Copy launcher icons
        run: |
          if [ -d res ]; then
            for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$dens
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher.png 2>/dev/null || true
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher_round.png 2>/dev/null || true
            done
          fi

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reiny-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
