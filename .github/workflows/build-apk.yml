name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform + sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json copiado correctamente"
            python3 -c "import json; d=json.load(open('android/app/google-services.json')); print('package =', d['client'][0]['client_info']['android_client_info']['package_name'])"
          else
            echo "ERROR: falta google-services.json en la raíz del repo"
            exit 1
          fi

      - name: Add Google Services plugin (root)
        run: |
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/classpath 'com.android.tools.build:gradle/a\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
            echo "classpath añadido en root build.gradle"
          fi

      - name: Add Google Services plugin (app)
        run: |
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            echo "plugin aplicado en app/build.gradle"
          fi

      - name: Add Firebase Messaging dependency
        run: |
          if ! grep -q "firebase-messaging" android/app/build.gradle; then
            sed -i "/dependencies {/a\    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'" android/app/build.gradle
            echo "Firebase Messaging añadido (BoM 33.7.0)"
          fi

      - name: Copy launcher icons
        run: |
          if [ -d res ]; then
            for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$dens
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher.png 2>/dev/null || true
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher_round.png 2>/dev/null || true
            done
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reiny-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
