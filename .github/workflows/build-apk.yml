name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web folder and Android project
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp -f index.html app.js style.css www/
          cp -f sw.js manifest.json www/ 2>/dev/null || true
          cp -f icon-192.png icon-512.png icon-48.png www/ 2>/dev/null || true
          cp -f favicon-32.png favicon-48.png apple-touch-icon.png www/ 2>/dev/null || true
          cp -a avatars www/ 2>/dev/null || true
          cp -a banners www/ 2>/dev/null || true
          ls -la www
          test -f www/index.html
          test -f www/app.js
          rm -rf android
          npx cap add android
          npx cap sync android
          test -d android

      - name: Set minSdkVersion 23
        run: |
          set -e
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = [0-9]\+/minSdkVersion = 23/' android/variables.gradle
            grep minSdk android/variables.gradle || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 23/' android/app/build.gradle || true
            grep -n "minSdk" android/app/build.gradle || true
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/minSdkVersion = [0-9]\+/minSdkVersion = 23/' android/build.gradle || true
          fi

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services from secret"
          elif [ -f google-services.json ]; then
            cp -f google-services.json android/app/google-services.json
            echo "google-services from repo"
          else
            echo "WARNING: no google-services.json"
          fi

      - name: Enable Google Services plugin
        run: |
          set -e
          if [ -f android/build.gradle ] && ! grep -q 'com.google.gms:google-services' android/build.gradle; then
            sed -i "/com.android.tools.build:gradle/a\        classpath 'com.google.gms:google-services:4.5.0'" android/build.gradle || true
          fi
          if [ -f android/app/build.gradle ]; then
            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle; then
              echo "" >> android/app/build.gradle
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
            if ! grep -q 'firebase-messaging' android/app/build.gradle; then
              sed -i "/dependencies {/a\    implementation platform('com.google.firebase:firebase-bom:34.17.0')\n    implementation 'com.google.firebase:firebase-messaging'" android/app/build.gradle || true
            fi
          fi
          grep -n "google-services\|firebase\|minSdk" android/variables.gradle android/build.gradle android/app/build.gradle 2>/dev/null || true

      - name: Copy launcher icons
        run: |
          if [ -d res ]; then
            for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$dens
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher.png 2>/dev/null || true
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher_round.png 2>/dev/null || true
            done
          fi

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reiny-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
