name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets (www)
        run: |
          # Crear carpeta www y copiar todos los archivos de la app
          mkdir -p www
          cp index.html app.js style.css manifest.json sw.js www/ 2>/dev/null || true
          cp *.png *.jpg www/ 2>/dev/null || true
          cp -r avatars banners www/ 2>/dev/null || true
          
          # Forzar webDir a "www" (más fiable que ".")
          if [ -f capacitor.config.json ]; then
            sed -i 's/"webDir": *"[^"]*"/"webDir": "www"/' capacitor.config.json
          else
            cat > capacitor.config.json << 'EOF'
          {
            "appId": "app.reiny.chat",
            "appName": "Reiny",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1200,
                "backgroundColor": "#EAF4FC",
                "showSpinner": false
              },
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#5B9FE3"
              }
            }
          }
          EOF
          fi
          
          echo "=== Contenido de www ==="
          ls -la www/
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json

      - name: Add Android platform + sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Add microphone + call permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Permiso de micrófono (obligatorio para llamadas)
          if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
            echo "RECORD_AUDIO añadido"
          fi
          
          # Mejor control de audio
          if ! grep -q "MODIFY_AUDIO_SETTINGS" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
            echo "MODIFY_AUDIO_SETTINGS añadido"
          fi
          
          # Notificaciones (Android 13+)
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
            echo "POST_NOTIFICATIONS añadido"
          fi
          
          # Servicio en primer plano (ayuda con llamadas)
          if ! grep -q "FOREGROUND_SERVICE" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            echo "FOREGROUND_SERVICE añadido"
          fi
          
          echo "=== Permisos actuales ==="
          grep "uses-permission" "$MANIFEST" || true

      - name: Copy google-services.json
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "google-services.json copiado"
            python3 -c "import json; d=json.load(open('android/app/google-services.json')); print('package =', d['client'][0]['client_info']['android_client_info']['package_name'])"
          else
            echo "ERROR: falta google-services.json"
            exit 1
          fi

      - name: Add Google Services (root)
        run: |
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/classpath 'com.android.tools.build:gradle/a\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
            echo "classpath añadido"
          fi

      - name: Add Google Services (app) + Firebase
        run: |
          # Aplicar plugin
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            echo "plugin aplicado"
          fi
          
          # Añadir Firebase Messaging (versión estable)
          if ! grep -q "firebase-messaging" android/app/build.gradle; then
            sed -i "/dependencies {/a\    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'" android/app/build.gradle
            echo "Firebase Messaging añadido"
          fi

      - name: Copy launcher icons
        run: |
          if [ -d res ]; then
            for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$dens
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher.png 2>/dev/null || true
              cp -f res/mipmap-$dens/ic_launcher.png android/app/src/main/res/mipmap-$dens/ic_launcher_round.png 2>/dev/null || true
            done
            echo "Iconos copiados"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reiny-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
